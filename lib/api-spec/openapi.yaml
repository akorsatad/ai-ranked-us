openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Rank API — daily AI-engine brand sentiment surveys
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Industries, brands, engines, metrics
  - name: rankings
    description: Brand rankings and trends
  - name: runs
    description: Survey runs
  - name: alerts
    description: Sharp-drop alerts computed after each survey run
  - name: admin
    description: Admin operations — manage catalog, keys, and browse data
  - name: auth
    description: Authentication (magic-link email)
  - name: rank
    description: Ad-hoc custom brand ranking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get the full catalog of industries, brands, engines, and metrics
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /overview:
    get:
      operationId: getOverview
      tags: [rankings]
      summary: Dashboard overview — per-industry leaders and last run status
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /industries/{industryId}/rankings:
    get:
      operationId: getIndustryRankings
      tags: [rankings]
      summary: Latest rankings for an industry, per engine and averaged
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          description: Metric key (e.g. positive_sentiment)
          schema:
            type: string
      responses:
        "200":
          description: Rankings for the industry and metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryRankings"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/trends:
    get:
      operationId: getIndustryTrends
      tags: [rankings]
      summary: 13-week trend lines for all brands in an industry for a metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = averaged across engines
          schema:
            type: string
      responses:
        "200":
          description: Trend lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryTrends"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /movers:
    get:
      operationId: getMovers
      tags: [rankings]
      summary: Biggest brand rank/score movers between the two most recent runs
      responses:
        "200":
          description: Movers report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoversReport"
  /brands/{brandId}/analytics:
    get:
      operationId: getBrandAnalytics
      tags: [rankings]
      summary: Per-brand analytics — standing on every metric + peer ranking
      parameters:
        - name: brandId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Brand analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAnalytics"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/history:
    get:
      operationId: getIndustryHistory
      tags: [rankings]
      summary: Real measured per-run historical score series for an industry metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          description: Metric key (e.g. positive_sentiment)
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = averaged across engines
          schema:
            type: string
      responses:
        "200":
          description: Historical series from stored survey runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryHistory"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/trend-snapshots:
    get:
      operationId: listTrendSnapshots
      tags: [rankings]
      summary: Dates of stored 13-week trend snapshots for an industry metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = all engines
          schema:
            type: string
      responses:
        "200":
          description: Snapshot dates, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendSnapshotList"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/trend-snapshots/{date}:
    get:
      operationId: getTrendSnapshot
      tags: [rankings]
      summary: 13-week trend snapshot as estimated on a specific date
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: path
          required: true
          description: Snapshot date (YYYY-MM-DD)
          schema:
            type: string
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = averaged across engines
          schema:
            type: string
      responses:
        "200":
          description: Trend lines as estimated on that date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendSnapshot"
        "404":
          description: Industry or snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Survey run history, newest first
      parameters:
        - name: status
          in: query
          required: false
          description: Only runs with this status
          schema:
            type: string
            enum: [running, pausing, cancelling, paused, completed, partial, failed, cancelled]
        - name: trigger
          in: query
          required: false
          description: Only runs with this trigger
          schema:
            type: string
            enum: [scheduled, manual, auto]
        - name: engineId
          in: query
          required: false
          description: Only runs scoped to this AI engine
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: Only runs started on or after this date (YYYY-MM-DD)
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Only runs started on or before this date (YYYY-MM-DD, inclusive)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyRun"
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Trigger a survey run now (optionally scoped to one industry)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunInput"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "400":
          description: Invalid or disabled industry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "422":
          description: Run refused — pre-flight provider key check failed and mode is block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/{runId}/pause:
    post:
      operationId: pauseRun
      tags: [runs]
      summary: Pause an in-progress survey run
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "202":
          description: Pause requested; the run stops between queries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Run is not in a pausable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/{runId}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Resume a paused survey run
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Run is not paused, or another run is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a running or paused survey run
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "202":
          description: Cancel requested; the run stops between queries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Run is not in a cancellable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/{runId}/report-issue:
    post:
      operationId: reportRunIssue
      tags: [runs]
      summary: Push a problem run into the alert queue
      description: Creates a run_issue alert summarizing the run's failures. Refused when the run has no issues or was already reported.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAlert"
        "400":
          description: Run has no issues to report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Run already reported to the alert queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /pricing:
    get:
      operationId: getPricing
      tags: [pricing]
      summary: Public pricing tiers
      responses:
        "200":
          description: Pricing tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTierList"
  /admin/pricing:
    get:
      operationId: getAdminPricing
      tags: [admin]
      summary: Pricing tiers for the admin editor
      responses:
        "200":
          description: Pricing tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTierList"
  /admin/pricing/{key}:
    put:
      operationId: updatePricingTier
      tags: [admin]
      summary: Update a tier's per-token rate, monthly fee, and included tokens
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricingTierInput"
      responses:
        "200":
          description: Updated tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTier"
        "400":
          description: Invalid values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Tier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/schedules:
    get:
      operationId: listSchedules
      tags: [admin]
      summary: Cron schedules (recurring and one-time)
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
    post:
      operationId: createSchedule
      tags: [admin]
      summary: Create a recurring or one-time schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/schedules/{id}:
    patch:
      operationId: updateSchedule
      tags: [admin]
      summary: Edit a schedule — switch mode/cadence, scope, or enable/disable
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSchedule
      tags: [admin]
      summary: Delete a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/summary:
    get:
      operationId: getRunsSummary
      tags: [runs]
      summary: Ops summary — first run, last run, next scheduled fire, counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunsSummary"
  /runs/reconcile:
    post:
      operationId: reconcileRuns
      tags: [runs]
      summary: Finalize runs stuck in an active state with a stale heartbeat
      responses:
        "200":
          description: Number of stale runs finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
  /runs/failed:
    delete:
      operationId: clearFailedRuns
      tags: [runs]
      summary: Delete all failed survey runs and their rows
      responses:
        "200":
          description: Count of runs deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs/{runId}:
    delete:
      operationId: deleteRun
      tags: [runs]
      summary: Delete a survey run and all rows that reference it
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Run deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Run is active — cancel it before deleting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries:
    post:
      operationId: createIndustry
      tags: [admin]
      summary: Create an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}:
    patch:
      operationId: updateIndustry
      tags: [admin]
      summary: Update or enable/disable an industry
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /brands:
    post:
      operationId: createBrand
      tags: [admin]
      summary: Create a brand in an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /brands/{brandId}:
    patch:
      operationId: updateBrand
      tags: [admin]
      summary: Update or enable/disable a brand
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engines:
    get:
      operationId: listEngines
      tags: [admin]
      summary: List all engines including disabled ones
      responses:
        "200":
          description: Engines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEngine"
    post:
      operationId: createEngine
      tags: [admin]
      summary: Add a new engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Engine key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engines/{engineId}:
    patch:
      operationId: updateEngine
      tags: [admin]
      summary: Update or enable/disable an engine
      parameters:
        - name: engineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "404":
          description: Engine not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engines/{engineId}/models:
    get:
      operationId: listEngineModels
      tags: [admin]
      summary: List the models an engine queries (with weights)
      parameters:
        - name: engineId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Engine models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngineModel"
    post:
      operationId: createEngineModel
      tags: [admin]
      summary: Add a model to an engine
      parameters:
        - name: engineId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineModelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineModel"
        "409":
          description: Model already exists for this engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engine-models/{modelId}:
    patch:
      operationId: updateEngineModel
      tags: [admin]
      summary: Update a model's weight, enabled state, id or label
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineModelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineModel"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteEngineModel
      tags: [admin]
      summary: Remove a model from an engine
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /settings/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: List per-provider API key status (masked)
      responses:
        "200":
          description: Key statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderKeyStatus"
  /settings/api-keys/{provider}:
    put:
      operationId: setApiKey
      tags: [admin]
      summary: Set or update a provider API key
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteApiKey
      tags: [admin]
      summary: Remove a stored provider API key (fall back to environment)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyStatus"
  /settings/key-preflight:
    get:
      operationId: getKeyPreflightSettings
      tags: [admin]
      summary: How a failing provider key affects starting a survey run
      responses:
        "200":
          description: Current setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPreflightSettings"
    put:
      operationId: updateKeyPreflightSettings
      tags: [admin]
      summary: Choose whether failing keys warn or block survey runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPreflightSettings"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPreflightSettings"
        "400":
          description: Invalid mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current admin session status
      description: Returns whether the signed-in user is the admin. The first authenticated user to call this claims admin access.
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Public (magic-link) users with usage stats
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
        - name: search
          in: query
          required: false
          description: Case-insensitive match on email or name
          schema:
            type: string
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
  /admin/users/{userId}:
    patch:
      operationId: updateUserStatus
      tags: [admin]
      summary: Disable or re-enable a public user account
      description: Disabling also revokes the user's active sessions.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppUser"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      summary: Admin accounts and pending email invites
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountList"
    post:
      operationId: inviteAdmin
      tags: [admin]
      summary: Invite an admin by email
      description: The invite is claimed automatically when a Clerk user with this email first opens the admin area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAdminInput"
      responses:
        "201":
          description: Created invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Already an admin or already invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/admins/{adminId}:
    delete:
      operationId: removeAdmin
      tags: [admin]
      summary: Remove an admin or revoke a pending invite
      description: You cannot remove yourself, and the last claimed admin cannot be removed.
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Refused (self-removal or last admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /settings/api-keys/{provider}/test:
    post:
      operationId: testApiKey
      tags: [admin]
      summary: Verify the active key for a provider with a minimal live call
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      responses:
        "200":
          description: Test result (ok=false carries the provider error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyTestResult"
        "400":
          description: Unknown provider or no key configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/costs:
    get:
      operationId: getCostSummary
      tags: [admin]
      summary: Aggregated spend and token usage by provider, model, and run
      parameters:
        - name: days
          in: query
          required: false
          description: Restrict to responses created in the last N days (omit for all time)
          schema:
            type: integer
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
  /admin/model-results:
    get:
      operationId: getModelResults
      tags: [admin]
      summary: Per-engine/model survey results for an industry and metric
      parameters:
        - name: industryId
          in: query
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model-level results alongside the aggregated ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelResults"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/tables/{table}:
    get:
      operationId: browseTable
      tags: [admin]
      summary: Read-only paginated rows from a core table
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [industries, brands, engines, survey_runs, survey_responses, users, sessions, ad_hoc_requests]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
        - name: search
          in: query
          required: false
          description: Case-insensitive text match on name-like columns
          schema:
            type: string
        - name: industryId
          in: query
          required: false
          schema:
            type: integer
        - name: runId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePage"
        "400":
          description: Unknown table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alert feed, newest first, plus unread count
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertFeed"
  /alerts/mark-read:
    post:
      operationId: markAlertsRead
      tags: [alerts]
      summary: Mark alerts read (specific ids, or all unread when ids omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAlertsReadInput"
      responses:
        "200":
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alerts/settings:
    get:
      operationId: getAlertSettings
      tags: [alerts]
      summary: Current alert thresholds
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
    put:
      operationId: updateAlertSettings
      tags: [alerts]
      summary: Update alert thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alerts/settings/test-email:
    post:
      operationId: sendTestAlertEmail
      tags: [alerts]
      summary: Send a sample alert digest email to the saved recipient
      responses:
        "200":
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: No valid recipient configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Email provider rejected the send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/prompt-template:
    get:
      operationId: getPromptTemplate
      tags: [admin]
      summary: Current survey prompt template, placeholders, and example values
      responses:
        "200":
          description: Prompt template info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
    put:
      operationId: updatePromptTemplate
      tags: [admin]
      summary: Update the survey prompt template used on the next run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptTemplateInput"
      responses:
        "200":
          description: Updated template info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
        "400":
          description: Invalid template (missing required placeholders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: resetPromptTemplate
      tags: [admin]
      summary: Reset one survey prompt template to the built-in default
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [current, trend]
      responses:
        "200":
          description: Template info after reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
        "400":
          description: Invalid kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/request-link:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic-link email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      summary: Verify a magic-link token and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerify"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/session:
    delete:
      operationId: signOut
      tags: [auth]
      summary: Destroy the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/admin/session:
    delete:
      operationId: adminSignOut
      tags: [admin]
      summary: Destroy the current admin session (Google sign-in)
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /rank/suggest-competitors:
    post:
      operationId: suggestCompetitors
      tags: [rank]
      summary: Ask an AI engine to suggest competitors for a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestCompetitorsInput"
      responses:
        "200":
          description: Suggested competitors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorSuggestions"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /rank/run:
    post:
      operationId: runAdHocRank
      tags: [rank]
      summary: Run an ad-hoc ranking for a brand set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdHocRankInput"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdHocRequestSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Authentication required for subsequent queries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "429":
          description: Daily limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
  /rank/requests/{requestId}:
    get:
      operationId: getAdHocRequest
      tags: [rank]
      summary: Poll the status and results of an ad-hoc ranking request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdHocRequestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /rank/history:
    get:
      operationId: getRankHistory
      tags: [rank]
      summary: List past ad-hoc ranking requests for the current user
      responses:
        "200":
          description: History list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdHocRequestSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminMe:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
        email:
          type: string
          nullable: true
    AdminAppUser:
      type: object
      required:
        [id, email, firstName, lastName, createdAt, disabled, rankRequests, activeSessions]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time
        disabled:
          type: boolean
        disabledAt:
          type: string
          format: date-time
          nullable: true
        rankRequests:
          type: integer
          description: Total ad-hoc ranking requests made by this user
        lastRequestAt:
          type: string
          format: date-time
          nullable: true
        activeSessions:
          type: integer
    AdminUserPage:
      type: object
      required: [users, total, page, pageSize]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminAppUser"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    UpdateUserStatusInput:
      type: object
      required: [disabled]
      properties:
        disabled:
          type: boolean
    AdminAccount:
      type: object
      required: [id, pending, self, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        pending:
          type: boolean
          description: True for an email invite not yet claimed
        self:
          type: boolean
          description: True when this row is the calling admin
        createdAt:
          type: string
          format: date-time
    AdminAccountList:
      type: object
      required: [admins]
      properties:
        admins:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
    InviteAdminInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email address of the person to invite
    ApiMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    PricingTier:
      type: object
      required: [key, name, blurb, costPerTokenUsd, includedTokens, features, highlighted, sortOrder]
      properties:
        key: { type: string }
        name: { type: string }
        blurb: { type: string }
        monthlyPriceUsd:
          type: number
          nullable: true
          description: Monthly plan fee; null means custom / contact sales
        costPerTokenUsd:
          type: number
          description: Billed rate per token for this tier
        includedTokens:
          type: integer
          description: Tokens included with the monthly fee before refills
        features:
          type: array
          items: { type: string }
        highlighted: { type: boolean }
        sortOrder: { type: integer }
        updatedAt:
          type: string
          format: date-time
    PricingTierList:
      type: object
      required: [tiers]
      properties:
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/PricingTier"
    UpdatePricingTierInput:
      type: object
      properties:
        costPerTokenUsd:
          type: number
        monthlyPriceUsd:
          type: number
          nullable: true
        includedTokens:
          type: integer
    BrandAlert:
      type: object
      properties:
        id: { type: integer }
        runId: { type: integer }
        brandId: { type: integer, nullable: true }
        brandName: { type: string }
        industryId: { type: integer, nullable: true }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        kind:
          type: string
          enum: [score_drop, rank_drop, run_issue]
        previousValue: { type: number }
        currentValue: { type: number }
        delta: { type: number }
        threshold: { type: number }
        read: { type: boolean }
        createdAt: { type: string }
      required:
        [
          id,
          runId,
          brandId,
          brandName,
          industryId,
          industryName,
          metric,
          metricLabel,
          kind,
          previousValue,
          currentValue,
          delta,
          threshold,
          read,
          createdAt,
        ]
    AlertFeed:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/BrandAlert"
        unreadCount: { type: integer }
      required: [alerts, unreadCount]
    UnreadCount:
      type: object
      properties:
        unreadCount: { type: integer }
      required: [unreadCount]
    MarkAlertsReadInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
    AlertSettings:
      type: object
      properties:
        scoreDropThreshold:
          type: number
          description: Score points (0-100) a brand must deteriorate by to alert
        rankDropThreshold:
          type: number
          description: Ranking positions a brand must fall by to alert
        emailEnabled:
          type: boolean
          description: Whether to send an email digest when new alerts fire
        emailRecipient:
          type: string
          description: Recipient address for alert email digests (empty when unset)
      required: [scoreDropThreshold, rankDropThreshold, emailEnabled, emailRecipient]
    AlertSettingsInput:
      type: object
      properties:
        scoreDropThreshold:
          type: number
          minimum: 1
          maximum: 100
        rankDropThreshold:
          type: number
          minimum: 1
          maximum: 50
        emailEnabled:
          type: boolean
        emailRecipient:
          type: string
          maxLength: 320
      required: [scoreDropThreshold, rankDropThreshold, emailEnabled, emailRecipient]
    Industry:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        enabled: { type: boolean }
      required: [id, name, slug, country, enabled]
    IndustryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        country: { type: string }
      required: [name]
    IndustryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        country: { type: string }
        enabled: { type: boolean }
    Brand:
      type: object
      properties:
        id: { type: integer }
        industryId: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
      required: [id, industryId, name, enabled]
    BrandInput:
      type: object
      properties:
        industryId: { type: integer }
        name: { type: string, minLength: 1 }
      required: [industryId, name]
    BrandUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        industryId: { type: integer }
        enabled: { type: boolean }
    Engine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
      required: [id, key, name, vendor]
    AdminEngine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string }
        enabled: { type: boolean }
      required: [id, key, name, vendor, provider, model, enabled]
    EngineInput:
      type: object
      properties:
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string, minLength: 1 }
      required: [key, name, provider, model]
    EngineUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string, minLength: 1 }
        enabled: { type: boolean }
    EngineModel:
      type: object
      properties:
        id: { type: integer }
        engineId: { type: integer }
        model: { type: string }
        label: { type: ["string", "null"] }
        weight: { type: number }
        enabled: { type: boolean }
        sortOrder: { type: integer }
      required: [id, engineId, model, label, weight, enabled, sortOrder]
    EngineModelInput:
      type: object
      properties:
        model: { type: string, minLength: 1 }
        label: { type: string }
        weight: { type: number, minimum: 0 }
        enabled: { type: boolean }
      required: [model]
    EngineModelUpdate:
      type: object
      properties:
        model: { type: string, minLength: 1 }
        label: { type: ["string", "null"] }
        weight: { type: number, minimum: 0 }
        enabled: { type: boolean }
        sortOrder: { type: integer }
    ProviderKeyStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        hasStoredKey: { type: boolean }
        maskedKey:
          type: ["string", "null"]
          description: Last 4 characters of the stored key, e.g. "••••abcd"
        hasEnvKey:
          type: boolean
          description: Whether an environment-variable key is available as fallback
        updatedAt: { type: ["string", "null"] }
      required: [provider, hasStoredKey, maskedKey, hasEnvKey, updatedAt]
    ApiKeyInput:
      type: object
      properties:
        key: { type: string, minLength: 8 }
      required: [key]
    ApiKeyTestResult:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        ok: { type: boolean }
        source:
          type: string
          enum: [stored, env]
          description: Which key was tested (stored keys take precedence)
        error:
          type: ["string", "null"]
          description: Provider error message when ok is false
      required: [provider, ok, source, error]
    PromptPlaceholder:
      type: object
      properties:
        name:
          type: string
          description: Placeholder token without braces, e.g. metric_label
        description: { type: string }
        required:
          type: boolean
          description: Whether the template must contain this placeholder
      required: [name, description, required]
    PromptTemplateKind:
      type: object
      properties:
        kind:
          type: string
          enum: [current, trend]
          description: current = daily ranking, trend = 13-week trajectory
        template:
          type: string
          description: The active template text for this kind (custom or default)
        isCustom:
          type: boolean
          description: True when a custom template is stored for this kind
        defaultTemplate:
          type: string
          description: The built-in default template text for this kind
      required: [kind, template, isCustom, defaultTemplate]
    PromptTemplateInfo:
      type: object
      properties:
        templates:
          type: array
          description: One entry per prompt kind (current, trend)
          items:
            $ref: "#/components/schemas/PromptTemplateKind"
        placeholders:
          type: array
          items:
            $ref: "#/components/schemas/PromptPlaceholder"
        exampleValues:
          type: object
          additionalProperties:
            type: string
          description: Example value for each placeholder, for client-side preview rendering
      required: [templates, placeholders, exampleValues]
    PromptTemplateInput:
      type: object
      properties:
        kind:
          type: string
          enum: [current, trend]
        template:
          type: string
          minLength: 1
      required: [kind, template]
    TablePage:
      type: object
      properties:
        table: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          description: Row objects keyed by column name; JSON columns are nested values
          items:
            type: object
            additionalProperties: true
      required: [table, page, pageSize, total, columns, rows]
    Metric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        higherIsBetter: { type: boolean }
      required: [key, label, description, higherIsBetter]
    Catalog:
      type: object
      properties:
        industries:
          type: array
          items:
            $ref: "#/components/schemas/Industry"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        engines:
          type: array
          items:
            $ref: "#/components/schemas/Engine"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
      required: [industries, brands, engines, metrics]
    RankingEntry:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        rank: { type: integer }
        score:
          type: number
          description: 0-100 score, higher is better on that metric
        rationale:
          type: ["string", "null"]
          description: Short engine-provided justification
        previousRank:
          type: ["integer", "null"]
          description: Brand's rank in the previous survey run (null when no prior run or brand absent)
      required: [brandId, brandName, rank, score]
    EngineRanking:
      type: object
      properties:
        engineKey: { type: string }
        engineName: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntry"
        surveyedAt:
          type: ["string", "null"]
          description: ISO timestamp of the response used
      required: [engineKey, engineName, entries]
    IndustryRankings:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        average:
          type: array
          description: Averaged across all engines
          items:
            $ref: "#/components/schemas/RankingEntry"
        byEngine:
          type: array
          items:
            $ref: "#/components/schemas/EngineRanking"
      required: [industryId, industryName, metric, average, byEngine]
    TrendPoint:
      type: object
      properties:
        weekIndex:
          type: integer
          description: 0 = 12 weeks ago ... 12 = current week
        weekLabel: { type: string }
        score: { type: number }
      required: [weekIndex, weekLabel, score]
    BrandTrend:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required: [brandId, brandName, points]
    IndustryTrends:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        engine:
          type: ["string", "null"]
          description: Engine key, or null when averaged across engines
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandTrend"
      required: [industryId, industryName, metric, engine, brands]
    TrendSnapshotDate:
      type: object
      properties:
        date:
          type: string
          description: Snapshot date (YYYY-MM-DD)
        runIds:
          type: array
          items:
            type: integer
        enginesCount:
          type: integer
          description: Number of engines that contributed a snapshot this date
      required: [date, runIds, enginesCount]
    TrendSnapshotList:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        snapshots:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/TrendSnapshotDate"
      required: [industryId, industryName, metric, snapshots]
    TrendSnapshot:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        date:
          type: string
          description: Snapshot date (YYYY-MM-DD)
        engine:
          type: ["string", "null"]
          description: Engine key, or null when averaged across engines
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandTrend"
      required: [industryId, industryName, metric, date, engine, brands]
    Mover:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        previousRank: { type: integer }
        currentRank: { type: integer }
        rankDelta:
          type: integer
          description: Positive = moved up (improved), negative = moved down
        previousScore: { type: number }
        currentScore: { type: number }
        scoreDelta:
          type: number
          description: currentScore - previousScore
      required:
        [industryId, industryName, metric, metricLabel, brandId, brandName,
         previousRank, currentRank, rankDelta, previousScore, currentScore, scoreDelta]
    BrandAnalyticsMetric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        higherIsBetter: { type: boolean }
        score: { type: ["number", "null"] }
        rank: { type: ["integer", "null"] }
        totalBrands: { type: integer }
        previousRank: { type: ["integer", "null"] }
      required: [key, label, higherIsBetter, score, rank, totalBrands, previousRank]
    BrandAnalyticsPeer:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        overallScore: { type: number }
        rank: { type: integer }
      required: [brandId, brandName, overallScore, rank]
    BrandAnalytics:
      type: object
      properties:
        brand:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            industryId: { type: integer }
            industryName: { type: string }
          required: [id, name, industryId, industryName]
        overallScore: { type: ["number", "null"] }
        overallRank: { type: ["integer", "null"] }
        peerCount: { type: integer }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/BrandAnalyticsMetric"
        peers:
          type: array
          items:
            $ref: "#/components/schemas/BrandAnalyticsPeer"
      required: [brand, overallScore, overallRank, peerCount, metrics, peers]
    MoversReport:
      type: object
      properties:
        latestRunId: { type: ["integer", "null"] }
        previousRunId: { type: ["integer", "null"] }
        latestRunAt: { type: ["string", "null"] }
        previousRunAt: { type: ["string", "null"] }
        movers:
          type: array
          description: Sorted by absolute movement, biggest first
          items:
            $ref: "#/components/schemas/Mover"
      required: [latestRunId, previousRunId, latestRunAt, previousRunAt, movers]
    HistoryPoint:
      type: object
      properties:
        runId: { type: integer }
        date:
          type: string
          description: ISO timestamp of the run's responses
        score: { type: number }
      required: [runId, date, score]
    BrandHistory:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
      required: [brandId, brandName, points]
    IndustryHistory:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        runsCount:
          type: integer
          description: Number of distinct runs with data for this industry/metric
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandHistory"
      required: [industryId, industryName, metric, runsCount, brands]
    IndustryLeader:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        score: { type: number }
      required: [industryId, industryName, metric, metricLabel, brandId, brandName, score]
    Overview:
      type: object
      properties:
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/SurveyRun"
            - type: "null"
        industriesCount: { type: integer }
        brandsCount: { type: integer }
        enginesCount: { type: integer }
        responsesCount: { type: integer }
        leaders:
          type: array
          description: Top brand per industry per metric (averaged across engines)
          items:
            $ref: "#/components/schemas/IndustryLeader"
      required: [lastRun, industriesCount, brandsCount, enginesCount, responsesCount, leaders]
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
      required: [id, email, firstName, lastName]
    MagicLinkRequest:
      type: object
      properties:
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
      required: [email, firstName, lastName]
    MagicLinkVerify:
      type: object
      properties:
        token: { type: string }
      required: [token]
    CurrentUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
      required: [id, email, firstName, lastName]
    SuggestCompetitorsInput:
      type: object
      properties:
        brand: { type: string }
        country: { type: string }
      required: [brand]
    CompetitorSuggestions:
      type: object
      properties:
        competitors:
          type: array
          items:
            type: string
      required: [competitors]
    AdHocRankInput:
      type: object
      properties:
        brand: { type: string }
        competitors:
          type: array
          items:
            type: string
        country: { type: string }
      required: [brand, competitors]
    AdHocRankingEntry:
      type: object
      properties:
        brandName: { type: string }
        rank: { type: integer }
        score: { type: number }
        rationale: { type: ["string", "null"] }
      required: [brandName, rank, score, rationale]
    AdHocMetricResult:
      type: object
      properties:
        metricKey: { type: string }
        metricLabel: { type: string }
        higherIsBetter: { type: boolean }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AdHocRankingEntry"
      required: [metricKey, metricLabel, higherIsBetter, entries]
    AdHocEngineResult:
      type: object
      properties:
        engineKey: { type: string }
        engineName: { type: string }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/AdHocMetricResult"
      required: [engineKey, engineName, metrics]
    AdHocResults:
      type: object
      properties:
        byEngine:
          type: array
          items:
            $ref: "#/components/schemas/AdHocEngineResult"
        averaged:
          type: array
          items:
            $ref: "#/components/schemas/AdHocMetricResult"
      required: [byEngine, averaged]
    AdHocRequestSummary:
      type: object
      properties:
        id: { type: integer }
        brand: { type: string }
        competitors:
          type: array
          items:
            type: string
        country: { type: string }
        status: { type: string }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
      required: [id, brand, competitors, country, status, error, createdAt, completedAt]
    AdHocRequestDetail:
      type: object
      properties:
        id: { type: integer }
        brand: { type: string }
        competitors:
          type: array
          items:
            type: string
        country: { type: string }
        status: { type: string }
        error: { type: ["string", "null"] }
        results:
          oneOf:
            - $ref: "#/components/schemas/AdHocResults"
            - type: "null"
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
      required: [id, brand, competitors, country, status, error, results, createdAt, completedAt]
    RateLimitError:
      type: object
      properties:
        message: { type: string }
        retryAt: { type: ["string", "null"] }
      required: [message]
    SurveyRun:
      type: object
      properties:
        id: { type: integer }
        status:
          type: string
          enum:
            [
              running,
              pausing,
              paused,
              cancelling,
              cancelled,
              completed,
              failed,
              partial,
            ]
        trigger:
          type: string
          enum: [scheduled, manual, auto]
        industryId:
          type: ["integer", "null"]
          description: When set, the run was scoped to this industry only
        engineId:
          type: ["integer", "null"]
          description: When set, the run was scoped to this AI engine only
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        heartbeatAt:
          type: ["string", "null"]
          description: Last liveness signal from the run loop; null for historical runs
        error: { type: ["string", "null"] }
        totalQueries: { type: integer }
        succeededQueries: { type: integer }
        failedQueries: { type: integer }
        keyWarnings:
          type: ["array", "null"]
          description: Provider key failures found by the pre-flight check before this run
          items:
            $ref: "#/components/schemas/KeyWarning"
        totalInputTokens:
          type: ["integer", "null"]
          description: Null for runs that predate usage tracking
        totalOutputTokens:
          type: ["integer", "null"]
        totalCostUsd:
          type: ["number", "null"]
          description: Estimated total cost in USD, null for historical runs
      required: [id, status, trigger, industryId, engineId, startedAt, completedAt, heartbeatAt, error, totalQueries, succeededQueries, failedQueries, keyWarnings, totalInputTokens, totalOutputTokens, totalCostUsd]
    ReconcileResult:
      type: object
      required: [finalized, message]
      properties:
        finalized: { type: integer }
        message: { type: string }
    Schedule:
      type: object
      required: [id, mode, industryId, engineId, enabled, nextRunAt, lastRunAt, lastRunId, createdAt]
      properties:
        id: { type: integer }
        mode:
          type: string
          enum: [once, recurring]
        cadence:
          type: ["string", "null"]
          enum: [daily, weekly, monthly, null]
        industryId: { type: ["integer", "null"] }
        engineId: { type: ["integer", "null"] }
        enabled: { type: boolean }
        nextRunAt: { type: string }
        lastRunAt: { type: ["string", "null"] }
        lastRunId: { type: ["integer", "null"] }
        createdAt: { type: string }
    ScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
    ScheduleInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [once, recurring]
        cadence:
          type: string
          enum: [daily, weekly, monthly]
        industryId: { type: integer }
        engineId: { type: integer }
        runAt:
          type: string
          description: ISO datetime — required for once, optional start for recurring
    ScheduleUpdate:
      type: object
      properties:
        mode:
          type: string
          enum: [once, recurring]
        cadence:
          type: string
          enum: [daily, weekly, monthly]
        industryId: { type: ["integer", "null"] }
        engineId: { type: ["integer", "null"] }
        enabled: { type: boolean }
        runAt: { type: string }
    RunsSummary:
      type: object
      required: [totalRuns, activeRuns, firstRun, lastRun, nextScheduledRun, statusCounts]
      properties:
        totalRuns: { type: integer }
        activeRuns: { type: integer }
        firstRun:
          oneOf:
            - $ref: "#/components/schemas/SurveyRun"
            - type: "null"
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/SurveyRun"
            - type: "null"
        nextScheduledRun:
          type: string
          description: ISO timestamp of the next scheduled daily fire (06:00 UTC)
        statusCounts:
          type: object
          additionalProperties:
            type: integer
    KeyWarning:
      type: object
      properties:
        provider: { type: string }
        source:
          type: string
          enum: [stored, env, none]
        error: { type: string }
      required: [provider, source, error]
    KeyPreflightSettings:
      type: object
      properties:
        mode:
          type: string
          enum: [warn, block]
          description: warn = start the run but flag it; block = refuse to start the run
      required: [mode]
    TriggerRunInput:
      type: object
      properties:
        industryId:
          type: integer
          description: Scope the run to a single industry; omit for a full run
        engineId:
          type: integer
          description: Scope the run to a single AI engine; omit for all engines
    CostBucket:
      type: object
      description: Aggregated usage and estimated cost for one grouping bucket
      properties:
        key: { type: string, description: "Provider name, model name, or run id depending on grouping" }
        label: { type: string }
        responses: { type: integer, description: "Number of successful responses in this bucket" }
        responsesWithUsage: { type: integer, description: "Responses that have token usage recorded" }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number, description: "Estimated cost in USD across responses with usage" }
        unknownCostResponses: { type: integer, description: "Responses with usage but no pricing table entry" }
      required: [key, label, responses, responsesWithUsage, inputTokens, outputTokens, costUsd, unknownCostResponses]
    RunCost:
      type: object
      properties:
        runId: { type: integer }
        startedAt: { type: string }
        status: { type: string }
        responses: { type: integer }
        responsesWithUsage: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number }
      required: [runId, startedAt, status, responses, responsesWithUsage, inputTokens, outputTokens, costUsd]
    CostSummary:
      type: object
      properties:
        days:
          type: ["integer", "null"]
          description: Time window in days that was applied, null = all time
        totals:
          $ref: "#/components/schemas/CostBucket"
        byProvider:
          type: array
          items:
            $ref: "#/components/schemas/CostBucket"
        byModel:
          type: array
          items:
            $ref: "#/components/schemas/CostBucket"
        byRun:
          type: array
          items:
            $ref: "#/components/schemas/RunCost"
      required: [days, totals, byProvider, byModel, byRun]
    ModelRankingEntry:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        rank: { type: integer }
        score: { type: number }
        rationale: { type: ["string", "null"] }
      required: [brandId, brandName, rank, score, rationale]
    ModelResult:
      type: object
      description: One engine/model's latest survey result for an industry+metric
      properties:
        engineId: { type: integer }
        engineKey: { type: string }
        engineName: { type: string }
        provider: { type: string }
        engineModelId: { type: ["integer", "null"] }
        model: { type: string }
        weight: { type: number, description: "Configured weight of this model within its engine" }
        normalizedWeight: { type: number, description: "This model's share of its engine's blended score (0-1)" }
        resolvedModel: { type: ["string", "null"] }
        surveyedAt: { type: string }
        runId: { type: integer }
        inputTokens: { type: ["integer", "null"] }
        outputTokens: { type: ["integer", "null"] }
        costUsd: { type: ["number", "null"] }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ModelRankingEntry"
      required: [engineId, engineKey, engineName, provider, engineModelId, model, weight, normalizedWeight, resolvedModel, surveyedAt, runId, inputTokens, outputTokens, costUsd, entries]
    ModelResults:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        aggregated:
          type: array
          items:
            $ref: "#/components/schemas/ModelRankingEntry"
        byModel:
          type: array
          items:
            $ref: "#/components/schemas/ModelResult"
      required: [industryId, industryName, metric, metricLabel, aggregated, byModel]
