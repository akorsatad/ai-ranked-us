openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Rank API — daily AI-engine brand sentiment surveys
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Industries, brands, engines, metrics
  - name: rankings
    description: Brand rankings and trends
  - name: runs
    description: Survey runs
  - name: admin
    description: Admin management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get the full catalog of industries, brands, engines, and metrics
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /overview:
    get:
      operationId: getOverview
      tags: [rankings]
      summary: Dashboard overview — per-industry leaders and last run status
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /industries/{industryId}/rankings:
    get:
      operationId: getIndustryRankings
      tags: [rankings]
      summary: Latest rankings for an industry, per engine and averaged
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          description: Metric key (e.g. positive_sentiment)
          schema:
            type: string
      responses:
        "200":
          description: Rankings for the industry and metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryRankings"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/trends:
    get:
      operationId: getIndustryTrends
      tags: [rankings]
      summary: 13-week trend lines for all brands in an industry for a metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = averaged across engines
          schema:
            type: string
      responses:
        "200":
          description: Trend lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryTrends"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Survey run history, newest first
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyRun"
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Trigger a survey run now
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      tags: [admin]
      summary: Full admin catalog including disabled items and engine details
      responses:
        "200":
          description: Admin catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalog"
  /admin/industries:
    post:
      operationId: createIndustry
      tags: [admin]
      summary: Create an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/industries/{industryId}:
    patch:
      operationId: updateIndustry
      tags: [admin]
      summary: Update or enable/disable an industry
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/brands:
    post:
      operationId: createBrand
      tags: [admin]
      summary: Create a brand in an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/brands/{brandId}:
    patch:
      operationId: updateBrand
      tags: [admin]
      summary: Update or enable/disable a brand
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/engines:
    post:
      operationId: createEngine
      tags: [admin]
      summary: Add an AI engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/engines/{engineId}:
    patch:
      operationId: updateEngine
      tags: [admin]
      summary: Update or enable/disable an engine
      parameters:
        - name: engineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: Per-provider API key status (masked)
      responses:
        "200":
          description: Key statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyStatus"
  /admin/api-keys/{provider}:
    put:
      operationId: setApiKey
      tags: [admin]
      summary: Set or clear a provider API key (empty string clears)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyStatus"
        "400":
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/data/{table}:
    get:
      operationId: browseTable
      tags: [admin]
      summary: Read-only paginated rows from a core table
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [industries, brands, engines, survey_runs, survey_responses]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: industryId
          in: query
          required: false
          schema:
            type: integer
        - name: engineId
          in: query
          required: false
          schema:
            type: integer
        - name: runId
          in: query
          required: false
          schema:
            type: integer
        - name: metric
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPage"
        "400":
          description: Unknown table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Industry:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        enabled: { type: boolean }
      required: [id, name, slug, country, enabled]
    Brand:
      type: object
      properties:
        id: { type: integer }
        industryId: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
      required: [id, industryId, name, enabled]
    IndustryInput:
      type: object
      properties:
        name: { type: string }
        country: { type: string }
      required: [name]
    IndustryUpdate:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
    BrandInput:
      type: object
      properties:
        industryId: { type: integer }
        name: { type: string }
      required: [industryId, name]
    BrandUpdate:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
    AdminEngine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string }
        enabled: { type: boolean }
      required: [id, key, name, vendor, provider, model, enabled]
    EngineInput:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string }
      required: [key, name, vendor, provider, model]
    EngineUpdate:
      type: object
      properties:
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        enabled: { type: boolean }
    AdminCatalog:
      type: object
      properties:
        industries:
          type: array
          items:
            $ref: "#/components/schemas/Industry"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        engines:
          type: array
          items:
            $ref: "#/components/schemas/AdminEngine"
      required: [industries, brands, engines]
    ApiKeyStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        maskedKey:
          type: ["string", "null"]
          description: Last 4 characters of the stored key, or null when none stored
        source:
          type: string
          enum: [stored, env, none]
          description: Which key the engine calls will use
      required: [provider, maskedKey, source]
    ApiKeyInput:
      type: object
      properties:
        apiKey:
          type: string
          description: The API key; empty string clears the stored key
      required: [apiKey]
    DataPage:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [rows, total, page, pageSize]
    Engine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
      required: [id, key, name, vendor]
    Metric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        higherIsBetter: { type: boolean }
      required: [key, label, description, higherIsBetter]
    Catalog:
      type: object
      properties:
        industries:
          type: array
          items:
            $ref: "#/components/schemas/Industry"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        engines:
          type: array
          items:
            $ref: "#/components/schemas/Engine"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
      required: [industries, brands, engines, metrics]
    RankingEntry:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        rank: { type: integer }
        score:
          type: number
          description: 0-100 score, higher is better on that metric
        rationale:
          type: ["string", "null"]
          description: Short engine-provided justification
      required: [brandId, brandName, rank, score]
    EngineRanking:
      type: object
      properties:
        engineKey: { type: string }
        engineName: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntry"
        surveyedAt:
          type: ["string", "null"]
          description: ISO timestamp of the response used
      required: [engineKey, engineName, entries]
    IndustryRankings:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        average:
          type: array
          description: Averaged across all engines
          items:
            $ref: "#/components/schemas/RankingEntry"
        byEngine:
          type: array
          items:
            $ref: "#/components/schemas/EngineRanking"
      required: [industryId, industryName, metric, average, byEngine]
    TrendPoint:
      type: object
      properties:
        weekIndex:
          type: integer
          description: 0 = 12 weeks ago ... 12 = current week
        weekLabel: { type: string }
        score: { type: number }
      required: [weekIndex, weekLabel, score]
    BrandTrend:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required: [brandId, brandName, points]
    IndustryTrends:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        engine:
          type: ["string", "null"]
          description: Engine key, or null when averaged across engines
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandTrend"
      required: [industryId, industryName, metric, engine, brands]
    IndustryLeader:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        score: { type: number }
      required: [industryId, industryName, metric, metricLabel, brandId, brandName, score]
    Overview:
      type: object
      properties:
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/SurveyRun"
            - type: "null"
        industriesCount: { type: integer }
        brandsCount: { type: integer }
        enginesCount: { type: integer }
        responsesCount: { type: integer }
        leaders:
          type: array
          description: Top brand per industry per metric (averaged across engines)
          items:
            $ref: "#/components/schemas/IndustryLeader"
      required: [lastRun, industriesCount, brandsCount, enginesCount, responsesCount, leaders]
    SurveyRun:
      type: object
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [running, completed, failed, partial]
        trigger:
          type: string
          enum: [scheduled, manual]
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        totalQueries: { type: integer }
        succeededQueries: { type: integer }
        failedQueries: { type: integer }
      required: [id, status, trigger, startedAt, completedAt, error, totalQueries, succeededQueries, failedQueries]
