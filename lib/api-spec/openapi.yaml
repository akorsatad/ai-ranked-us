openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Rank API — daily AI-engine brand sentiment surveys
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Industries, brands, engines, metrics
  - name: rankings
    description: Brand rankings and trends
  - name: runs
    description: Survey runs
  - name: alerts
    description: Sharp-drop alerts computed after each survey run
  - name: admin
    description: Admin operations — manage catalog, keys, and browse data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Get the full catalog of industries, brands, engines, and metrics
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /overview:
    get:
      operationId: getOverview
      tags: [rankings]
      summary: Dashboard overview — per-industry leaders and last run status
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /industries/{industryId}/rankings:
    get:
      operationId: getIndustryRankings
      tags: [rankings]
      summary: Latest rankings for an industry, per engine and averaged
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          description: Metric key (e.g. positive_sentiment)
          schema:
            type: string
      responses:
        "200":
          description: Rankings for the industry and metric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryRankings"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}/trends:
    get:
      operationId: getIndustryTrends
      tags: [rankings]
      summary: 13-week trend lines for all brands in an industry for a metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - name: engine
          in: query
          required: false
          description: Engine key to filter by; omitted = averaged across engines
          schema:
            type: string
      responses:
        "200":
          description: Trend lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryTrends"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /movers:
    get:
      operationId: getMovers
      tags: [rankings]
      summary: Biggest brand rank/score movers between the two most recent runs
      responses:
        "200":
          description: Movers report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoversReport"
  /industries/{industryId}/history:
    get:
      operationId: getIndustryHistory
      tags: [rankings]
      summary: Real measured per-run historical score series for an industry metric
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: query
          required: true
          description: Metric key (e.g. positive_sentiment)
          schema:
            type: string
      responses:
        "200":
          description: Historical series from stored survey runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryHistory"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Survey run history, newest first
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyRun"
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Trigger a survey run now (optionally scoped to one industry)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunInput"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyRun"
        "400":
          description: Invalid or disabled industry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries:
    post:
      operationId: createIndustry
      tags: [admin]
      summary: Create an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /industries/{industryId}:
    patch:
      operationId: updateIndustry
      tags: [admin]
      summary: Update or enable/disable an industry
      parameters:
        - name: industryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Industry"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /brands:
    post:
      operationId: createBrand
      tags: [admin]
      summary: Create a brand in an industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /brands/{brandId}:
    patch:
      operationId: updateBrand
      tags: [admin]
      summary: Update or enable/disable a brand
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engines:
    get:
      operationId: listEngines
      tags: [admin]
      summary: List all engines including disabled ones
      responses:
        "200":
          description: Engines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEngine"
    post:
      operationId: createEngine
      tags: [admin]
      summary: Add a new engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Engine key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /engines/{engineId}:
    patch:
      operationId: updateEngine
      tags: [admin]
      summary: Update or enable/disable an engine
      parameters:
        - name: engineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEngine"
        "404":
          description: Engine not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /settings/api-keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: List per-provider API key status (masked)
      responses:
        "200":
          description: Key statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderKeyStatus"
  /settings/api-keys/{provider}:
    put:
      operationId: setApiKey
      tags: [admin]
      summary: Set or update a provider API key
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteApiKey
      tags: [admin]
      summary: Remove a stored provider API key (fall back to environment)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeyStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Current admin session status
      description: Returns whether the signed-in user is the admin. The first authenticated user to call this claims admin access.
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /settings/api-keys/{provider}/test:
    post:
      operationId: testApiKey
      tags: [admin]
      summary: Verify the active key for a provider with a minimal live call
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini, openrouter]
      responses:
        "200":
          description: Test result (ok=false carries the provider error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyTestResult"
        "400":
          description: Unknown provider or no key configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/tables/{table}:
    get:
      operationId: browseTable
      tags: [admin]
      summary: Read-only paginated rows from a core table
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [industries, brands, engines, survey_runs, survey_responses]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 25
        - name: search
          in: query
          required: false
          description: Case-insensitive text match on name-like columns
          schema:
            type: string
        - name: industryId
          in: query
          required: false
          schema:
            type: integer
        - name: runId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Page of rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePage"
        "400":
          description: Unknown table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alert feed, newest first, plus unread count
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertFeed"
  /alerts/mark-read:
    post:
      operationId: markAlertsRead
      tags: [alerts]
      summary: Mark alerts read (specific ids, or all unread when ids omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAlertsReadInput"
      responses:
        "200":
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alerts/settings:
    get:
      operationId: getAlertSettings
      tags: [alerts]
      summary: Current alert thresholds
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
    put:
      operationId: updateAlertSettings
      tags: [alerts]
      summary: Update alert thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/prompt-template:
    get:
      operationId: getPromptTemplate
      tags: [admin]
      summary: Current survey prompt template, placeholders, and example values
      responses:
        "200":
          description: Prompt template info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
    put:
      operationId: updatePromptTemplate
      tags: [admin]
      summary: Update the survey prompt template used on the next run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptTemplateInput"
      responses:
        "200":
          description: Updated template info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
        "400":
          description: Invalid template (missing required placeholders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: resetPromptTemplate
      tags: [admin]
      summary: Reset the survey prompt template to the built-in default
      responses:
        "200":
          description: Template info after reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplateInfo"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminMe:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
        email:
          type: string
          nullable: true
    ApiMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    BrandAlert:
      type: object
      properties:
        id: { type: integer }
        runId: { type: integer }
        brandId: { type: integer }
        brandName: { type: string }
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        kind:
          type: string
          enum: [score_drop, rank_drop]
        previousValue: { type: number }
        currentValue: { type: number }
        delta: { type: number }
        threshold: { type: number }
        read: { type: boolean }
        createdAt: { type: string }
      required:
        [
          id,
          runId,
          brandId,
          brandName,
          industryId,
          industryName,
          metric,
          metricLabel,
          kind,
          previousValue,
          currentValue,
          delta,
          threshold,
          read,
          createdAt,
        ]
    AlertFeed:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/BrandAlert"
        unreadCount: { type: integer }
      required: [alerts, unreadCount]
    UnreadCount:
      type: object
      properties:
        unreadCount: { type: integer }
      required: [unreadCount]
    MarkAlertsReadInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
    AlertSettings:
      type: object
      properties:
        scoreDropThreshold:
          type: number
          description: Score points (0-100) a brand must deteriorate by to alert
        rankDropThreshold:
          type: number
          description: Ranking positions a brand must fall by to alert
        emailEnabled:
          type: boolean
          description: Whether to send an email digest when new alerts fire
        emailRecipient:
          type: string
          description: Recipient address for alert email digests (empty when unset)
      required: [scoreDropThreshold, rankDropThreshold, emailEnabled, emailRecipient]
    AlertSettingsInput:
      type: object
      properties:
        scoreDropThreshold:
          type: number
          minimum: 1
          maximum: 100
        rankDropThreshold:
          type: number
          minimum: 1
          maximum: 50
        emailEnabled:
          type: boolean
        emailRecipient:
          type: string
          maxLength: 320
      required: [scoreDropThreshold, rankDropThreshold, emailEnabled, emailRecipient]
    Industry:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        enabled: { type: boolean }
      required: [id, name, slug, country, enabled]
    IndustryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        country: { type: string }
      required: [name]
    IndustryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        country: { type: string }
        enabled: { type: boolean }
    Brand:
      type: object
      properties:
        id: { type: integer }
        industryId: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
      required: [id, industryId, name, enabled]
    BrandInput:
      type: object
      properties:
        industryId: { type: integer }
        name: { type: string, minLength: 1 }
      required: [industryId, name]
    BrandUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        industryId: { type: integer }
        enabled: { type: boolean }
    Engine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
      required: [id, key, name, vendor]
    AdminEngine:
      type: object
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string }
        enabled: { type: boolean }
      required: [id, key, name, vendor, provider, model, enabled]
    EngineInput:
      type: object
      properties:
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string, minLength: 1 }
      required: [key, name, provider, model]
    EngineUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        vendor: { type: string }
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        model: { type: string, minLength: 1 }
        enabled: { type: boolean }
    ProviderKeyStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        hasStoredKey: { type: boolean }
        maskedKey:
          type: ["string", "null"]
          description: Last 4 characters of the stored key, e.g. "••••abcd"
        hasEnvKey:
          type: boolean
          description: Whether an environment-variable key is available as fallback
        updatedAt: { type: ["string", "null"] }
      required: [provider, hasStoredKey, maskedKey, hasEnvKey, updatedAt]
    ApiKeyInput:
      type: object
      properties:
        key: { type: string, minLength: 8 }
      required: [key]
    ApiKeyTestResult:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        ok: { type: boolean }
        source:
          type: string
          enum: [stored, env]
          description: Which key was tested (stored keys take precedence)
        error:
          type: ["string", "null"]
          description: Provider error message when ok is false
      required: [provider, ok, source, error]
    PromptPlaceholder:
      type: object
      properties:
        name:
          type: string
          description: Placeholder token without braces, e.g. metric_label
        description: { type: string }
        required:
          type: boolean
          description: Whether the template must contain this placeholder
      required: [name, description, required]
    PromptTemplateInfo:
      type: object
      properties:
        template:
          type: string
          description: The active template text (custom or default)
        isCustom:
          type: boolean
          description: True when a custom template is stored in the database
        defaultTemplate:
          type: string
          description: The built-in default template text
        placeholders:
          type: array
          items:
            $ref: "#/components/schemas/PromptPlaceholder"
        exampleValues:
          type: object
          additionalProperties:
            type: string
          description: Example value for each placeholder, for client-side preview rendering
      required: [template, isCustom, defaultTemplate, placeholders, exampleValues]
    PromptTemplateInput:
      type: object
      properties:
        template:
          type: string
          minLength: 1
      required: [template]
    TablePage:
      type: object
      properties:
        table: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          description: Row objects keyed by column name; JSON columns are nested values
          items:
            type: object
            additionalProperties: true
      required: [table, page, pageSize, total, columns, rows]
    Metric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        higherIsBetter: { type: boolean }
      required: [key, label, description, higherIsBetter]
    Catalog:
      type: object
      properties:
        industries:
          type: array
          items:
            $ref: "#/components/schemas/Industry"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        engines:
          type: array
          items:
            $ref: "#/components/schemas/Engine"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
      required: [industries, brands, engines, metrics]
    RankingEntry:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        rank: { type: integer }
        score:
          type: number
          description: 0-100 score, higher is better on that metric
        rationale:
          type: ["string", "null"]
          description: Short engine-provided justification
      required: [brandId, brandName, rank, score]
    EngineRanking:
      type: object
      properties:
        engineKey: { type: string }
        engineName: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RankingEntry"
        surveyedAt:
          type: ["string", "null"]
          description: ISO timestamp of the response used
      required: [engineKey, engineName, entries]
    IndustryRankings:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        average:
          type: array
          description: Averaged across all engines
          items:
            $ref: "#/components/schemas/RankingEntry"
        byEngine:
          type: array
          items:
            $ref: "#/components/schemas/EngineRanking"
      required: [industryId, industryName, metric, average, byEngine]
    TrendPoint:
      type: object
      properties:
        weekIndex:
          type: integer
          description: 0 = 12 weeks ago ... 12 = current week
        weekLabel: { type: string }
        score: { type: number }
      required: [weekIndex, weekLabel, score]
    BrandTrend:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required: [brandId, brandName, points]
    IndustryTrends:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        engine:
          type: ["string", "null"]
          description: Engine key, or null when averaged across engines
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandTrend"
      required: [industryId, industryName, metric, engine, brands]
    Mover:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        previousRank: { type: integer }
        currentRank: { type: integer }
        rankDelta:
          type: integer
          description: Positive = moved up (improved), negative = moved down
        previousScore: { type: number }
        currentScore: { type: number }
        scoreDelta:
          type: number
          description: currentScore - previousScore
      required:
        [industryId, industryName, metric, metricLabel, brandId, brandName,
         previousRank, currentRank, rankDelta, previousScore, currentScore, scoreDelta]
    MoversReport:
      type: object
      properties:
        latestRunId: { type: ["integer", "null"] }
        previousRunId: { type: ["integer", "null"] }
        latestRunAt: { type: ["string", "null"] }
        previousRunAt: { type: ["string", "null"] }
        movers:
          type: array
          description: Sorted by absolute movement, biggest first
          items:
            $ref: "#/components/schemas/Mover"
      required: [latestRunId, previousRunId, latestRunAt, previousRunAt, movers]
    HistoryPoint:
      type: object
      properties:
        runId: { type: integer }
        date:
          type: string
          description: ISO timestamp of the run's responses
        score: { type: number }
      required: [runId, date, score]
    BrandHistory:
      type: object
      properties:
        brandId: { type: integer }
        brandName: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
      required: [brandId, brandName, points]
    IndustryHistory:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        runsCount:
          type: integer
          description: Number of distinct runs with data for this industry/metric
        brands:
          type: array
          items:
            $ref: "#/components/schemas/BrandHistory"
      required: [industryId, industryName, metric, runsCount, brands]
    IndustryLeader:
      type: object
      properties:
        industryId: { type: integer }
        industryName: { type: string }
        metric: { type: string }
        metricLabel: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        score: { type: number }
      required: [industryId, industryName, metric, metricLabel, brandId, brandName, score]
    Overview:
      type: object
      properties:
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/SurveyRun"
            - type: "null"
        industriesCount: { type: integer }
        brandsCount: { type: integer }
        enginesCount: { type: integer }
        responsesCount: { type: integer }
        leaders:
          type: array
          description: Top brand per industry per metric (averaged across engines)
          items:
            $ref: "#/components/schemas/IndustryLeader"
      required: [lastRun, industriesCount, brandsCount, enginesCount, responsesCount, leaders]
    SurveyRun:
      type: object
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [running, completed, failed, partial]
        trigger:
          type: string
          enum: [scheduled, manual]
        industryId:
          type: ["integer", "null"]
          description: When set, the run was scoped to this industry only
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        totalQueries: { type: integer }
        succeededQueries: { type: integer }
        failedQueries: { type: integer }
      required: [id, status, trigger, industryId, startedAt, completedAt, error, totalQueries, succeededQueries, failedQueries]
    TriggerRunInput:
      type: object
      properties:
        industryId:
          type: integer
          description: Scope the run to a single industry; omit for a full run
